<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>초대작가 소개 | (사)한반도문화예술협회</title>
<meta name="description" content="2026 제19회 한반도미술대전 초대작가 소개">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-menu="artists" data-doc="초대작가 소개">
<header class="site-header"></header>
<script src="js/layout.js"></script>
<section class="title-band">
  <div class="container">
    <h1>초대작가 소개</h1>
    <nav class="year-tabs" aria-label="회차 선택" data-render="tabs" data-page="artists"></nav>
  </div>
</section>
<main class="container artists-main">
    <form class="search-box" id="artist-search" data-list="artist-table" data-pager="artist-pager" data-per-page="15" role="search" aria-label="초대작가 검색">
      <label class="sr-only" for="artist-table-field">검색 항목</label>
      <select id="artist-table-field"><option value="name">작가명</option><option value="field">분야</option><option value="all">전체</option></select>
      <label class="sr-only" for="artist-table-q">검색어</label>
      <input id="artist-table-q" type="search" placeholder="검색어를 입력하세요">
    </form>

    <table class="data-table" id="artist-table">
      <caption class="sr-only">제19회 초대작가 목록</caption>
      <thead>
        <tr><th class="col-name" scope="col">작가명</th><th class="col-field" scope="col"><span class="sr-only">분야</span></th><th class="col-desc" scope="col"><span class="sr-only">경력</span></th></tr>
      </thead>
      <tbody data-render="artist-rows"></tbody>
    </table>

    <nav class="pager" id="artist-pager" aria-label="페이지">
      <strong aria-current="page">1</strong>
    </nav>
</main>
<footer class="site-footer"></footer>
<script src="data/site-data.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
